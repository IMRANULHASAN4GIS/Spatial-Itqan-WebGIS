services:
  database:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: spatial_itqan
      POSTGRES_USER: spatial_itqan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - spatial_itqan_db:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spatial_itqan -d spatial_itqan']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DATABASE_URL: postgresql://spatial_itqan:${POSTGRES_PASSWORD}@database:5432/spatial_itqan
      DATABASE_SSL: 'false'
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  spatial_itqan_db:
